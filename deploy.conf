#!/bin/bash

# -------------------------------------------------------
# Configuration for EmpireCrafting deploy.sh
# -------------------------------------------------------

# ### GitOps Configuration
# URL to the GitOps repository that Flux monitors
GITOPS_REPO_URL="ssh://git@192.168.1.11:222/sarah/cluster-config.git"
# Local path where the GitOps repo will be cloned
GITOPS_REPO_PATH="../cluster-config"
# Path within the GitOps repo to the application's manifests
GITOPS_APP_PATH="apps/EmpireCrafting/deployment.yaml"

# ### Docker Registry
# URL of the private Docker registry
DOCKER_REGISTRY="192.168.1.11:5000"

# ### Application Image Names
BACKEND_IMAGE_NAME="empire-project-backend"
FRONTEND_IMAGE_NAME="empire-project-frontend"

# ### Ingress Configuration
# Hostname for production releases (e.g., release/1.2.3)
INGRESS_HOST_PROD="empire.145multimedia.co.uk"
# Hostname for development builds (e.g., develop, feature/*)
INGRESS_HOST_DEV="empire-dev.145multimedia.co.uk"
