apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: empire-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
