[package]
name = "empireProject"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11.0"
actix-cors = "0.7.1"
futures = "0.3"
mongodb = "3.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.142"
dotenv = "0.15"
tokio = { version = "1.47.1", features = ["full"] }
log = "0.4.27"
env_logger = "0.11"